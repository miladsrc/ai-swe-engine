version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sase
      POSTGRES_PASSWORD: sase
      POSTGRES_DB: sase
    ports:
      # Host 5433: host 5432 is taken by another local Postgres instance
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sase"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://sase:sase@postgres:5432/sase
      # Local-dev placeholder for CI evidence identity (api/security.py:
      # require_ci_actor). Replace with a real secret for anything beyond
      # localhost — see README "Environment variables".
      SASE_CI_TOKEN: "dev-ci-token-change-me"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  # --- Phases 4-6 of the roadmap (not wired up yet) ---
